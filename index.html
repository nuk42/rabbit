<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>연습</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="192x192" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body oncontextmenu="return false;" onselectstart="return false;">
    <div id="loading-overlay">
        <div class="loading-text">로딩 중...</div>
    </div>
    <div id="app-container">
        <div id="game-screen"></div>

        <div id="top-ui">
            <div id="tab-bar">
                <button class="tab-btn active" data-tab="mash">연타 연습</button>
                <button class="tab-btn" data-tab="okma">옥마패 연습</button>
            </div>
            <div id="mash-controls" class="tab-controls">
                <label class="count-label"><input type="checkbox" class="count-checkbox" value="4" checked> 4개</label>
                <label class="count-label"><input type="checkbox" class="count-checkbox" value="6" checked> 6개</label>
                <label class="count-label"><input type="checkbox" class="count-checkbox" value="8" checked> 8개</label>
                <label class="count-label"><input type="checkbox" class="count-checkbox" value="10" checked> 10개</label>
            </div>
            <div id="okma-controls" class="tab-controls hidden">
                <label class="diff-label"><input type="radio" name="okma-diff" value="0"> 쉬움</label>
                <label class="diff-label"><input type="radio" name="okma-diff" value="4" checked> 보통</label>
                <label class="diff-label"><input type="radio" name="okma-diff" value="10"> 어려움</label>
                <label class="diff-label okma-sidan-label"><input type="checkbox" id="okma-sidan"> 시단</label>
            </div>
        </div>

    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
